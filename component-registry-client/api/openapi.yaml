openapi: 3.1.0
info:
  contact:
    email: cmdi@clarin.eu
    name: CLARIN ERIC
    url: https://www.clarin.eu
  description: Components and profiles registry for the Component Metadata Infrastructure
  title: Component Registry API
  version: "1.0"
servers:
- description: Generated server url
  url: http://localhost:8080/rest
tags:
- description: Components and profiles as items (common data model)
  name: Items
- description: Registry of components and profiles
  name: Components and profiles
- description: Information on the user
  name: User
paths:
  /user:
    get:
      operationId: getInfo
      parameters:
      - explode: true
        in: query
        name: userId
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: principalName
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryUser"
            application/xml:
              schema:
                $ref: "#/components/schemas/RegistryUser"
          description: User info
      summary: "Info for a user, normally the current user"
      tags:
      - User
      x-accepts:
      - application/json
      - application/xml
  /user/teams:
    get:
      operationId: getTeams
      parameters:
      - explode: true
        in: query
        name: userId
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UserGroup"
                type: array
                default: null
            application/xml:
              schema:
                items:
                  $ref: "#/components/schemas/UserGroup"
                type: array
                default: null
          description: A list of teams of which the user is a member
      summary: Get a user's teams
      tags:
      - User
      x-accepts:
      - application/json
      - application/xml
  /registry/profiles:
    get:
      operationId: getProfiles
      parameters:
      - explode: true
        in: query
        name: registrySpace
        required: false
        schema:
          enum:
          - PUBLIC
          - PRIVATE
          - GROUP
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          items:
            enum:
            - development
            - production
            - deprecated
            type: string
          type: array
          default: null
        style: form
      - explode: true
        in: query
        name: sortBy
        required: false
        schema:
          default: name
          type: string
        style: form
      - explode: true
        in: query
        name: sortDirection
        required: false
        schema:
          default: ASC
          enum:
          - ASC
          - DESC
          type: string
        style: form
      - explode: true
        in: query
        name: groupId
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilesList"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProfilesList"
          description: OK
      tags:
      - Components and profiles
      x-accepts:
      - application/json
      - application/xml
  /registry/profiles/{componentId}/description:
    get:
      operationId: getProfileItem
      parameters:
      - explode: false
        in: path
        name: componentId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDescription"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProfileDescription"
          description: OK
      tags:
      - Components and profiles
      x-accepts:
      - application/json
      - application/xml
  /registry/items:
    get:
      operationId: getItems
      parameters:
      - explode: true
        in: query
        name: type
        required: false
        schema:
          enum:
          - COMPONENT
          - PROFILE
          type: string
        style: form
      - explode: true
        in: query
        name: registrySpace
        required: false
        schema:
          enum:
          - PUBLIC
          - PRIVATE
          - GROUP
          type: string
        style: form
      - explode: true
        in: query
        name: groupId
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          items:
            enum:
            - development
            - production
            - deprecated
            type: string
          type: array
          default: null
        style: form
      - explode: true
        in: query
        name: sortBy
        required: false
        schema:
          default: name
          type: string
        style: form
      - explode: true
        in: query
        name: sortDirection
        required: false
        schema:
          default: ASC
          enum:
          - ASC
          - DESC
          type: string
        style: form
      responses:
        "200":
          content:
            application/xml:
              schema:
                items:
                  $ref: "#/components/schemas/BaseDescription"
                type: array
                default: null
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BaseDescription"
                type: array
                default: null
          description: A list of items that meet the filter criteria (if applicable)
      summary: Get a filtered list of descriptions of profiles and/or components
      tags:
      - Items
      x-accepts:
      - application/json
      - application/xml
  /registry/items/{componentId}:
    get:
      operationId: getItem
      parameters:
      - explode: false
        in: path
        name: componentId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/BaseDescription"
            application/json:
              schema:
                $ref: "#/components/schemas/BaseDescription"
          description: A description of the identified item
        "404":
          description: Item not found
      summary: Get the description of a profile or component
      tags:
      - Items
      x-accepts:
      - application/json
      - application/xml
  /registry/items/{componentId}/spec:
    get:
      operationId: getItemSpec
      parameters:
      - explode: false
        in: path
        name: componentId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: Accept
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ComponentSpec"
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentSpec"
          description: |
            The component specification of the identified item.
            The JSON representation is derived from the primary
            specification which is stored as XML.
        "404":
          description: Item not found
      summary: Get the specification for the profile or component
      tags:
      - Items
      x-accepts:
      - application/json
      - application/xml
  /registry/components:
    get:
      operationId: getComponents
      parameters:
      - explode: true
        in: query
        name: registrySpace
        required: false
        schema:
          default: PUBLIC
          enum:
          - PUBLIC
          - PRIVATE
          - GROUP
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          items:
            enum:
            - development
            - production
            - deprecated
            type: string
          type: array
          default: null
        style: form
      - explode: true
        in: query
        name: sortBy
        required: false
        schema:
          default: name
          type: string
        style: form
      - explode: true
        in: query
        name: sortDirection
        required: false
        schema:
          default: ASC
          enum:
          - ASC
          - DESC
          type: string
        style: form
      - explode: true
        in: query
        name: groupId
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentsList"
            application/xml:
              schema:
                $ref: "#/components/schemas/ComponentsList"
          description: OK
      tags:
      - Components and profiles
      x-accepts:
      - application/json
      - application/xml
  /registry/components/{componentId}/description:
    get:
      operationId: getComponentItem
      parameters:
      - explode: false
        in: path
        name: componentId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentDescription"
            application/xml:
              schema:
                $ref: "#/components/schemas/ComponentDescription"
          description: OK
      tags:
      - Components and profiles
      x-accepts:
      - application/json
      - application/xml
