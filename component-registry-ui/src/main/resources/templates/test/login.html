<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns="http://www.w3.org/1999/xhtml">
    <head th:replace="~{fragments/base :: head}">
        <title>Login</title> 
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/fontawesome.min.css"
              crossorigin="anonymous"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/solid.min.css"
              crossorigin="anonymous" />
    </head>

    <body>
        <div class="container-fluid">
            <header th:replace="~{fragments/header :: header('', null)}">
                {HEADER}
            </header>


            <main id="login-main" class="my-4">

                <div th:if="${param.error}">
                    Invalid username and password.
                </div>
                <div th:if="${param.logout}">
                    You have been logged out.
                </div>

                <div class="container-sm border" sec:authorize="isAuthenticated()">
                    <h1 th:inline="text">Hello <span th:remove="tag" sec:authentication="name">{user}</span>, you are already logged in!</h1>
                </div>

                <div class="container-sm border" sec:authorize="!isAuthenticated()">
                    <h1 class="text-center p-2">Please log in:</h1>

                    <div class="d-flex justify-content-center pb-2">

                        <form th:action="@{/login}" method="post">
                            <div><label> User Name : <input type="text" name="username" value="user"/> </label></div>
                            <div><label> Password: <input type="password" name="password" value="password"/> </label></div>
                            <div><input type="submit" value="Sign In"/></div>
                        </form>
                    </div>
                </div>
            </main>

            <div class="clearfix"></div>

            <footer th:replace="~{fragments/footer :: footer}">
                {FOOTER}
            </footer>
        </div>
    </body>
</html>
