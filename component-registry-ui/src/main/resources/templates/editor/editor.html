<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns="http://www.w3.org/1999/xhtml">
    <head th:replace="~{fragments/base :: head}">
        <title>Editor</title> 
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/fontawesome.min.css"
              crossorigin="anonymous"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/solid.min.css"
              crossorigin="anonymous" />
    </head>

    <body>
        <div class="container-fluid px-xl-2 px-xxl-5 vh-100">
            <div class="d-flex flex-column h-100">
                <header th:replace="~{fragments/header :: header('editor', ${itemId})}">
                    {HEADER}
                </header>
                <main id="editor-main">
                    <div class="container">
                        <div class="row">
                            <div class="col-8">

                                <section class="p-2 w-50">
                                    <h2>Item description</h2>
                                    <form th:replace="~{/editor/fragments/itemDescriptionForm :: #item-description-form}">
                                        {item description form}
                                    </form>
                                </section>

                                <section class="p-2">
                                    <h2>Specification</h2>
                                    <div th:replace="~{/editor/fragments/specForm :: specForm(componentId = ${description.id})}">
                                        {specification form}
                                    </div>
                                </section>

                            </div>

                            <div class="col-4 p-2">
                                <pre class="border m-2 p-1 text-bg-secondary" style="" th:text="${description}"></pre>
                                <pre class="border m-2 p-1 text-bg-secondary" style="" th:text="${spec}"></pre>
                            </div>
                        </div>
                    </div>
                </main>

                <footer th:replace="~{fragments/footer :: footer}">
                    {FOOTER}
                </footer>
            </div>
        </div>

        <!--/*
            Value scheme modal does not play nice with history, therefore
            we need to check and if necessary do a cleanup on load.
        */-->
        <script type="text/javascript" defer>
            document.body.addEventListener('htmx:load', function () {
                console.log('checking for orphaned backdrop');
                var modal = bootstrap.Modal.getInstance('#valueSchemeModal');
                if (!modal) {
                    //remove modal backdrop
                    const  backdropElements = document.getElementsByClassName('modal-backdrop');
                    if (backdropElements) {
                        console.log('removing orphaned modal backdrop');
                        for (let i = 0; i < backdropElements.length; i++) {
                            backdropElements.item(i).remove();
                        }
                    }
                    const modalElement = document.getElementById('valueSchemeModal');
                    if (modalElement) {
                        console.log('hiding modal');
                        modalElement.style.display = 'none';
                    }
                }
            });
        </script>
    </body>
</html>
