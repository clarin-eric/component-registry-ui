<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Editor</title>
    </head>

    <body>
        <main>

            <div class="container">

                <div th:fragment="specForm(componentId)" 
                     id="spec-form" 
                     x-data="{componentSelectorOpen: false}">
                    <form th:action="@{/editor/{componentId}/spec(componentId=${componentId})}"
                          th:with="rootComponentId=${componentId}"
                          method="post">

                        <!-- No form for header (?) -->
                        <div id="specNoopHeader" class="hidden"></div>

                        <!-- Root component is rendered as a regular component 
                        (recursively, with child components and elements), but
                        without the header and other preamble -->

                        <input type="hidden" name="header.id" th:value="${componentId}" />

                        <div id="root-component">
                            <div th:replace="~{/editor/fragments/componentFormBlock :: componentBlockContent(
                                 component = ${spec.component},
                                 rootComponentId = ${rootComponentId},
                                 basePath = 'component',
                                 fieldsDivId = 'root-component-fields',
                                 headerId = 'specNoopHeader',
                                 fieldsToHide = ${ { 'cardinalityMin', 'cardinalityMax' } },
                                 iterStat = null)}">
                                [root component]
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Submit</button>

                        <!--/* "Off canvas" container for the component selector (activated when the 'Link existing component' action is chosen) */-->
                        <div id="componentSelectorOffcanvas" 
                             class="offcanvas offcanvas-bottom" style="height: 60%"
                             :class="{'show': componentSelectorOpen}">
                            <div class="offcanvas-header">
                                <h5 class="offcanvas-title" id="offcanvasLabel">Select component to link</h5>
                                <button type="button" class="btn-close" aria-label="Close" @click="componentSelectorOpen = false"></button>
                            </div>
                            <div id="componentSelectorContainer" class="offcanvas-body" >
                                [component selector]
                            </div>
                        </div>
                    </form>

                    <div id="valueSchemeModal"
                         class="modal modal-blur fade"
                         data-bs-backdrop='static' 
                         data-bs-keyboard="false"
                         style="display: none"
                         aria-hidden="false"
                         tabindex="-1">
                        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
                            <div class="modal-content"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
