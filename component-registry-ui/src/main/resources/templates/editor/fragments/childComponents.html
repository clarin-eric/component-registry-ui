<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Child components</title>
    </head>

    <body>
        <main>
            <!-- Child components section for components -->
            <div th:fragment="childComponents(components, basePath, parentId)">

                <span class="h3 visually-hidden">Components</span>
                <div class="p-2 visually-hidden" th:if="${#lists.size(components) == 0}">
                    No components
                </div>

                <div id="childComponents" class="ms-2" 
                     th:each="childComponent, iterStat : ${components}"
                     th:with="isInline= ${#strings.isEmpty(childComponent.componentRef)}">

                    <!--/* Inline components */-->
                    <th:block th:if="${isInline}">
                        <!--/* Component form block */-->
                        <div th:replace="~{/editor/fragments/componentFormBlock :: componentBlock(
                             component = ${childComponent}, 
                             basePath = |${basePath}.component[${iterStat.index}]|,
                             parentId = ${fieldsDivId},
                             iterStat = ${iterStat})}">
                        </div>
                    </th:block>

                    <!--/* Referenced components */-->
                    <th:block th:if="${!isInline}">
                        <div  th:replace="~{/editor/fragments/componentRef :: componentRef(
                              component = ${childComponent}, 
                              basePath = |${basePath}.component[${iterStat.index}]|,
                              parentId = ${fieldsDivId},
                              iterStat = ${iterStat})}">
                        </div>
                    </th:block>
                </div>

                <div class="px-2">
                    <!--/* Add component button */-->
                    <div th:replace="~{/editor/fragments/transformationControls 
                         :: addChildComponentButton(path = ${basePath}, parentId=${fieldsDivId})}"></div>
                </div>
            </div> <!-- end fragment: childComponents -->
        </main>
    </body>
</html>
