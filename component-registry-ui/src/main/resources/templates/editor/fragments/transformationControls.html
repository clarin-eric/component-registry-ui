<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Reusable controls for component spec transformation</title>
    </head>

    <body>
        <main>
            <!--/* Common action buttons (delete, move) for components, elements, attributes */-->
            <div th:fragment="blockEditControls(path, parentId, itemName, type, canMoveUp, canMoveDown)"
                 th:with="TransformationActions=${T(eu.clarin.cmdi.componentregistry.ui.service.TransformationActions)}"
                 th:hx-target="|#${parentId}|"
                 th:hx-select="|#${parentId}|"
                 hx-swap="innerHTML"
                 th:hx-push-url="true">

                <!--/* Delete button */-->
                <a href="#" class="btn btn-outline-danger action-delete" title="Delete"
                   th:hx-post="@{/editor/transform(
                   operation=${TransformationActions.DELETE},
                   path=${path},
                   itemId=${rootComponentId}, uniqId=${#strings.randomAlphanumeric(6)})}">
                    <i class="fa-solid fa-trash"></i>
                    <span class="visually-hidden">Delete</span>
                </a>

                <!--/* "Move up" button */-->
                <a href="#" class="btn btn-outline-primary action-move" title="Move up"
                   th:classAppend="${canMoveUp ? '' : 'disabled opacity-25'  }"
                   th:hx-post="@{/editor/transform(
                   operation=${TransformationActions.moveUpActionFor(type)},
                   path=${path},
                   itemId=${rootComponentId}, uniqId=${#strings.randomAlphanumeric(6)})}">
                    <i class="fa-solid fa-arrow-up"></i>
                    <span class="visually-hidden">Move up</span>
                </a>

                <!--/* "Move down" button */-->
                <a href="#" class="btn btn-outline-primary action-move" title="Move down"
                   th:classAppend="${canMoveDown ? '' : 'disabled opacity-25'  }"
                   th:hx-post="@{/editor/transform(
                   operation=${TransformationActions.moveDownActionFor(type)},
                   path=${path},
                   itemId=${rootComponentId}, uniqId=${#strings.randomAlphanumeric(6)})}">
                    <i class="fa-solid fa-arrow-down"></i>
                    <span class="visually-hidden">Move down</span>
                </a>
            </div> <!-- end fragment: blockEditControls -->

            <!--/* Add component button */-->
            <div th:fragment="addChildComponentButton(path, parentId)"
                 th:with="TransformationActions=${T(eu.clarin.cmdi.componentregistry.ui.service.TransformationActions)}">

                <div class="dropdown">
                    <button class="btn btn-link dropdown-toggle btn-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-solid fa-plus"></i>
                        Add a component
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" 
                               th:hx-get="@{/editor/componentsSelector}"
                               hx-select="#componentSelector"
                               hx-target="#componentSelectorContainer"
                               hx-swap="innerHTML"
                               @htmx:after-request="componentSelectorOpen = true">
                                <span>Link existing component</span>
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" 
                               href="#" title="Add a component"
                               th:hx-post="@{/editor/transform(
                               operation=${TransformationActions.ADD_CHILD_COMPONENT},
                               path=${basePath},
                               itemId=${rootComponentId}, uniqId=${#strings.randomAlphanumeric(6)})}"
                               th:hx-target="|#${parentId}|"
                               th:hx-select="|#${parentId}|"
                               hx-indicator="closest .dropdown"
                               hx-push-url="true">
                                <span>Create inline component</span>
                            </a>
                        </li>
                    </ul>
                    <div class="spinner-border spinner-border-sm htmx-indicator" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

            </div> <!-- end fragment: addChildComponentButton -->

            <!--/* Add element button */-->
            <div th:fragment="addChildElementButton(path, parentId)"
                 th:with="TransformationActions=${T(eu.clarin.cmdi.componentregistry.ui.service.TransformationActions)}">
                <a href="#" class="btn btn-link btn-sm" title="Add an element" 
                   th:hx-post="@{/editor/transform(
                   operation=${TransformationActions.ADD_CHILD_ELEMENT},
                   path=${basePath},
                   itemId=${rootComponentId}, uniqId=${#strings.randomAlphanumeric(6)})}"
                   th:hx-target="|#${fieldsDivId}|"
                   th:hx-select="|#${fieldsDivId}|"
                   hx-push-url="true"
                   hx-indicator="closest div">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add an element</span>
                </a>    
                <div class="spinner-border spinner-border-sm htmx-indicator" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div> <!-- end fragment: addChildElementButton -->

            <!--/* Add attribute button */-->
            <div th:fragment="addChildAttributeButton(path, parentId, type)"
                 th:with="TransformationActions=${T(eu.clarin.cmdi.componentregistry.ui.service.TransformationActions)}">
                <a href="#" class="btn btn-link btn-sm" title="Add an attribute"
                   th:hx-post="@{/editor/transform(
                   operation=${TransformationActions.addAttributeActionFor(type)},
                   path=${basePath},
                   itemId=${rootComponentId}, uniqId=${#strings.randomAlphanumeric(6)})}"
                   th:hx-target="|#${fieldsDivId}|"
                   th:hx-select="|#${fieldsDivId}|"
                   hx-push-url="true"
                   hx-indicator="closest div">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add an attribute</span>
                </a>
                <div class="spinner-border spinner-border-sm htmx-indicator" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </main>
    </body>
</html>
