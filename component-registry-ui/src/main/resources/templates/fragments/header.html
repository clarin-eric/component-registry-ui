<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <body>
        <header th:fragment="header(current, item)">
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                        <i th:class="|fa-solid fa-#{application.icon}|"></i>
                        [[#{application.title}]]</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                            <li th:replace="~{::top-navigation-item('browser','/browser',${current})}">
                                [Browser]
                            </li>

                            <!--/* not in editor for specific item: new item link */-->
                            <th:block th:unless="${item}">
                                <li th:replace="~{::top-navigation-item('editor',|/editor|,${current})}">
                                    [Editor]
                                </li>
                            </th:block>

                            <!--/* in editor with specific item id: link should go to same */-->
                            <th:block th:if="${item}">
                                <li th:replace="~{::top-navigation-item('editor',|/editor/${item}|,${current})}">
                                    [Editor]
                                </li>
                            </th:block>

                            <li th:replace="~{::top-navigation-item('help','/help',${current})}">
                                [Help]
                            </li>
                        </ul>
                        <form class="d-flex" role="login">
                            <a th:href="@{/login}" class="btn btn-outline-primary">
                                <i class="fa-solid fa-right-to-bracket"></i>
                                Log in
                            </a>
                        </form>
                    </div>
                </div>
            </nav>
        </header>

        <!-- menu item in the top navigation bar -->
        <li th:fragment="top-navigation-item(id,link,current)"
            class="nav-item">
            <a class="nav-link" 
               th:classappend="${current == id} ? 'active'"
               th:aria-current="${current == id} ? 'page' : null" 
               th:href="@{${link}}" th:text="#{|application.menu.${id}|}">
                [link text]
            </a>
        </li>
    </body>
</html>
