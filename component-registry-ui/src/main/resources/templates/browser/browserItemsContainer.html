<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Browser container pane</title> 
    </head>

    <body>
        <main>
            <!-- Table "panel" -->
            <div id="items-container"
                 class="p-2 h-100"
                 x-data="{ itemViewMax: false }">
                <div id="item-view" class="offcanvas offcanvas-end w-50" tabindex="-1" data-bs-theme="dark">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasLabel">Item</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>  
                    <div id="item-viewer-content" class="offcanvas-body">

                    </div>
                </div>


                <div class="d-flex flex-column h-100">
                    <div class="d-flex">
                        <div class="p-2">
                            <div th:switch="${type}">
                                <h2 th:case='profile' th:text="#{types.profile.plural}">PROFILES</h2>
                                <h2 th:case='component' th:text="#{types.component.plural}">COMPONENTS</h2>
                                <h2 th:case='*'>???</h2>
                            </div>
                        </div>
                        <div class="p-2 htmx-indicator" id="table-load-indicator" >
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <div class="p-2 ms-auto">
                            <a class="btn btn-primary" href="#">
                                <i class="fa-solid fa-square-plus"></i>
                                New
                            </a>
                        </div>
                    </div>
                    <div class="pb-1">
                        <div th:replace="~{browser/browserItemsOptions :: browserItemsOptions(type=${type}, status=${status}, textFilter=${textFilter}, sortBy=${sortedBy}, sortDirection=${sortedDirection})}">
                            [Options]
                        </div>
                    </div>
                    <div class="p-2 flex-grow-1 overflow-y-auto">
                        <div hx-trigger="load"
                             th:hx-get="@{/browser/items(type=${type},status=${status}, textFilter=${textFilter}, sortBy=${sortedBy}, sortDirection=${sortedDirection})}"
                             hx-select="#items-table-wrapper"
                             hx-swap="innerHTML"
                             hx-indicator="#items-container">
                        </div>
                    </div>

                    <!--/* item preview container, content to be replaced when a selection is active */-->
                    <div id="browser-item-view-container" class="mt-2"
                         :class="itemViewMax ? 'maximized':''">
                        <!--/* Item selection on load? Lazy loading of details */-->
                        <th:block th:if="!${#strings.isEmpty(selectedItem)}">
                            <!--/* some content that we will replace on load */-->
                            <div id="browser-item-view"
                                 hx-trigger="load"
                                 th:hx-get="@{|/browser/items/${selectedItem}|}"
                                 hx-select="#browser-item-view"
                                 hx-select-oob="#selected-item-actions"
                                 hx-swap="outerHTML">
                                <div id="browser-item-view-content" style="height: 15em;">
                                    <div class="htmx-indicator">
                                        <div class="spinner-border" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                        <div class="mt-2 text-secondary">
                                            Loading [[${selectedItem}]]...
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </th:block>
                    </div>
                </div>



            </div> <!-- END table "panel" -->
        </main>
    </body>
</html>
