<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head th:replace="~{fragments/base :: head}">
        <title>browser</title> 
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/fontawesome.min.css"
              crossorigin="anonymous"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/solid.min.css"
              crossorigin="anonymous" />
    </head>

    <body>
        <div class="container-fluid px-xl-2 px-xxl-5 vh-100">
            <div class="d-flex flex-column h-100">
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="#">
                            <i th:class="|fa-solid fa-#{application.icon}|"></i>
                            [[#{application.title}]]</a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarSupportedContent">
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                                <li class="nav-item">
                                    <a class="nav-link" th:href="@{/}" th:text="#{application.menu.home}">{home}</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link active" aria-current="page" th:href="@{/}" th:text="#{application.menu.browser}">{browser}</a>
                                </li>
                            </ul>
                            <form class="d-flex" role="login">
                                <a href="#" class="btn btn-outline-primary">
                                    <i class="fa-solid fa-right-to-bracket"></i>
                                    Log in
                                </a>
                            </form>
                        </div>
                    </div>
                </nav>

                <main id="browser-main" 
                      class="d-flex" 
                      style="min-height: 90%; max-height: 90%;"
                      x-data="{ selectedItem: '' }">
                    <div class="ps-2 pt-2 me-auto h-100">
                        <!-- Sidebar -->
                        <div th:replace="~{browser/browserSidebar :: #browser-sidebar}">
                            {sidebar}
                        </div>
                    </div>

                    <!-- Table "panel" -->
                    <div class="flex-fill ms-auto border rounded h-100">
                        <div th:replace="~{browser/browserItemsContainer :: #items-container}">
                            {items container}
                        </div> <!-- END table "panel" -->
                    </div>
                </main>
            </div>
        </div>
    </body>
</html>
