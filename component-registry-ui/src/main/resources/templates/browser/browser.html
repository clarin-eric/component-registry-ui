<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head th:replace="~{fragments/base :: head}">
        <title>browser</title> 
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/fontawesome.min.css"
              crossorigin="anonymous"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/solid.min.css"
              crossorigin="anonymous" />
    </head>

    <body th:with="selectedItem = ${!#lists.isEmpty(selectedItems)}?${selectedItems[0]}:''">
        <div class="container-fluid px-xl-2 px-xxl-5 vh-100">
            <div class="d-flex flex-column h-100">
                <header th:replace="~{fragments/header :: header('browser', null)}">
                    {HEADER}
                </header>

                <main id="browser-main" 
                      class="mt-1 d-flex" 
                      style="min-height: 90%; max-height: 90%;"
                      th:x-data="|{ selectedItem: '${selectedItem}' }|">
                    <div class="ps-2 pt-2 me-auto h-100">
                        <!-- Sidebar -->
                        <div th:replace="~{browser/browserSidebar :: #browser-sidebar}">
                            {sidebar}
                        </div>
                    </div>

                    <!-- Table "panel" -->
                    <div class="flex-fill ms-auto border rounded h-100">
                        <div th:replace="~{browser/browserItemsContainer :: #items-container}">
                            {items container}
                        </div> <!-- END table "panel" -->
                    </div>
                </main>

                <footer th:replace="~{fragments/footer :: footer}">
                    {FOOTER}
                </footer>

            </div>
        </div>
    </body>
</html>
