<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Items table body</title> 
    </head>
    <body>
        <table>
            <!-- Table header with sorting options -->
            <thead>
            </thead>
            <!-- Data -->
            <tbody th:fragment="itemsTableBody" 
                   id="items-table-body">

                <tr th:each="description : ${items}"
                    th:x-data="|{itemId: '${description['id']}'}|"
                    :class="{ 'table-active': (selectedItem == itemId) }"
                    @click="selectedItem = itemId"
                    th:hx-get="@{/itemActions(item=${description['id']})}"
                    hx-target="#selected-item-actions"
                    hx-select="#selected-item-actions"
                    hx-swap="outerHTML">

                    <td th:each="field: ${fields}" 
                        th:class="|column-field_${field}|">
                        <span th:switch="${field}">
                            <span th:case="name">
                                <a class="item-info" 
                                   th:hx-get="@{|/item/${description.id}|}|"
                                   hx-select="#browser-item-view"
                                   hx-target="#browser-item-view-container"
                                   hx-swap="innerHTML">
                                    <i class="fa-solid fa-circle-info"></i></a>
                                <span th:text="${description[field]}">link</span>
                            </span>
                            <span th:case="*" 
                                  th:text="${description[field]}">value</span>
                        </span>
                    </td>

                </tr>

            </tbody>
        </table>

    </body>
</html>
