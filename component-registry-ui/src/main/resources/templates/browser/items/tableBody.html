<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Items table body</title> 
    </head>
    <body>
        <table>
            <!-- Table header with sorting options -->
            <thead>
            </thead>
            <!-- Data -->
            <tbody th:fragment="itemsTableBody" 
                   id="items-table-body"
                   th:switch="${mode}">

                <!-- Editor mode -->
                <th:block th:case="'editor'"
                          th:with="TransformationActions=${T(eu.clarin.cmdi.componentregistry.ui.service.TransformationActions)}">
                    <tr th:id="|table_${description['id']}|"
                        th:each="description : ${items}">
                        <td>
                            <a class="btn btn-primary" 
                               href="#" title="Add a component"
                               th:hx-post="@{/editor/transform(
                               operation=${TransformationActions.LINK_CHILD_COMPONENT},
                               path=${path},
                               linkId=${description['id']},
                               itemId=${itemId},
                               uniqId=${#strings.randomAlphanumeric(6)})}"
                               th:hx-target="|#${parentId}|"
                               th:hx-select="|#${parentId}|"
                               hx-indicator="closest table"
                               hx-push-url="true"
                               @htmx:after-request="componentSelectorOpen = false">
                                +
                            </a>

                        </td>
                        <td th:replace="~{this :: rowBody(${mode}, ${fields})}">body</td>
                    </tr>
                </th:block>

                <!-- Browser mode -->
                <th:block th:case="*">
                    <tr th:id="|table_${description['id']}|"
                        th:each="description : ${items}"
                        th:x-data="|{itemId: '${description['id']}'}|"
                        :class="{ 'table-active': (selectedItem == itemId) }"
                        @click="selectedItem = itemId"
                        th:hx-get="@{|/item/${description.id}|}"
                        th:hx-push-url="@{|/#table_${description['id']}|(item=${description.id},type=${type})}"
                        hx-target="#browser-item-view-container"
                        hx-select="#browser-item-view"
                        hx-select-oob="#selected-item-actions"
                        hx-swap="innerHTML">
                        <td th:replace="~{this :: rowBody(${mode}, ${fields})}">body</td>
                    </tr>
                </th:block>
            </tbody>
        </table>

        <th:block th:fragment="rowBody(mode, fields)">
            <td th:each="field: ${fields}" 
                th:class="|column-field_${field}|">
                <span th:text="${description[field]}">link</span>
            </td>
        </th:block>

    </body>
</html>
