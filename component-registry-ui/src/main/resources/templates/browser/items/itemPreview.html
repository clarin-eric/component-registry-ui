<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Browser item view</title> 
    </head>

    <body>
        <main>
            <div id="browser-item-view" th:fragment="preview">
                <div class="p-2 border">
                    <a data-bs-toggle="collapse" 
                       href="#browser-item-view-content" role="button" aria-expanded="false" aria-controls="browser-item-view-content">
                        <i class="fa-solid fa-angles-down"></i>
                    </a>
                    <div id="browser-item-view-content" class="collapse show overflow-x-hidden overflow-y-auto" style="max-height: 15em;">
                        <h3 class="border-bottom" th:text="${item.name}">name</h3>
                        <div class="row">
                            <div class="col-md order-lg-last">
                                <div><strong>Identifier:</strong> <span th:text="${item.id}"></span></div>
                                <div><strong>Creator:</strong> <span th:text="${item.creatorName}"></span></div>
                                <div><strong>Registered:</strong> <span th:text="${item.registrationDate}"></span></div>
                            </div>
                            <div class="col-md-8 order-lg-first">
                                <p th:text="${item.description}"></p>
                            </div>
                        </div>
                        <pre id="item-spec" style="max-width: 80em;" class="overflow-auto" th:text="${spec}"></pre>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
