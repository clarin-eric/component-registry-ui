<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head th:replace="~{fragments/base :: head}">
        <title>item</title> 
    </head>
    <body>
        <main class="my-2">
            <div id="item-info" class="container h-100">
                <div class="h-25 overflow-auto">
                    <div class="container border-bottom">
                        <h3 class="border-bottom" th:text="${item.name}">name</h3>
                        <div class="row">
                            <div class="col-md order-lg-last">
                                <div><strong>Identifier:</strong> <span th:text="${item.id}"></span></div>
                                <div><strong>Creator:</strong> <span th:text="${item.creatorName}"></span></div>
                                <div><strong>Registered:</strong> <span th:text="${item.registrationDate}"></span></div>
                            </div>
                            <div class="col-md-8 order-lg-first">
                                <p th:text="${item.description}"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="h-75 overflow-y-auto">
                    <div class="container overflow-x-hidden"
                         hx-trigger="load"
                         th:hx-get="@{|/browser/items/${item.id}/specification|}"
                         hx-select="#item-spec"></div>
                </div>
            </div> <!-- container -->
        </main>

    </body>
</html>
