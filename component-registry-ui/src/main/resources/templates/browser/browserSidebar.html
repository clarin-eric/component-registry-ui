<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Browser sidebar</title> 
    </head>

    <body>
        <div class="container-fluid vh-100">
            <main>
                <!--/* Sidebar */-->
                <div id="browser-sidebar" 
                     class="d-flex flex-column h-100">
                    <div class="mb-2 pb-2 border-bottom">
                        <div th:replace="~{ :: spacesDropdown}">
                            [Spaces]
                        </div>
                    </div>
                    <div>
                        <ul class="nav nav-pills flex-column mb-auto"
                            hx-boost="true"
                            hx-target="#browser-main"
                            hx-swap="outerHTML show:none"
                            hx-indicator="#items-container">
                            <li class="nav-item">
                                <a th:href="@{/browser/main?type=profile}"
                                   class="nav-link" 
                                   th:classappend="${type == 'profile' ? 'active' : ''}"
                                   th:aria-selected="${type == 'profile'}">
                                    Profiles
                                </a>
                            </li>
                            <li>
                                <a th:href="@{/browser/main?type=component}" 
                                   class="nav-link"
                                   th:classappend="${type == 'component' ? 'active' : ''}"
                                   th:aria-selected="${type == 'component'}">
                                    Components
                                </a>
                            </li>
                        </ul>
                    </div>
                </div> <!--/* END sidebar */-->
            </main>
        </div>

        <th:block th:remove="all">
            <!-- Fragment: spaces dropdown -->
            <div th:fragment="spacesDropdown" class="dropdown">
                <a class="btn btn-secondary dropdown-toggle" href="#" role="button"
                   data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fa-solid fa-globe"></i>
                    Public
                </a>

                <ul class="dropdown-menu" sec:authorize="!isAuthenticated()">
                    <li><a class="dropdown-item disabled" href="#">
                            <i class="fa-solid fa-lock"></i>
                            Private</a></li>
                </ul>

                <ul class="dropdown-menu" sec:authorize="isAuthenticated()">
                    <li>
                        <a th:href="@{/browser/(type=${type}, space='private')}"
                           class="dropdown-item">
                            <i class="fa-solid fa-user"></i>
                            Private</a>
                    </li>
                    <li th:each="team : ${userTeams}">
                        <a class="dropdown-item" 
                           th:href="@{/browser/(type=${type}, space='group', groupId=${team.id})}">
                            <i class="fa-solid fa-user-group"></i>
                            [[${team.name}]]</a>
                    </li>
                </ul>
            </div>
        </th:block>
    </body>
</html>
